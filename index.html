<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Concord Orchestra Tools</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; line-height: 1.6; color: #24292e; max-width: 800px; margin: 40px auto; padding: 0 20px; }
        h1 { border-bottom: 1px solid #eaecef; padding-bottom: .3em; }
        ul { list-style: none; padding: 0; }
        li { margin: 10px 0; padding: 15px; border: 1px solid #e1e4e8; border-radius: 6px; transition: background 0.2s; }
        li:hover { background-color: #f6f8fa; }
        a { text-decoration: none; color: #0366d6; font-weight: 600; font-size: 1.1em; }
        .loading { color: #6a737d; font-style: italic; }
    </style>
</head>
<body>
    <h1>Concord Orchestra Digital Tools</h1>
    <div id="content">
        <p class="loading">Loading tools...</p>
    </div>

    <script>
        async function loadTools() {
            const repoOwner = 'jjrussell';
            const repoName = 'concord_orchestra';
            const contentDiv = document.getElementById('content');

            try {
                // Fetch the list of files from the GitHub API
                const response = await fetch(`https://api.github.com/repos/${repoOwner}/${repoName}/contents/`);
                const files = await response.json();

                // Filter for .html files, excluding this index.html
                const htmlFiles = files.filter(file => 
                    file.name.endsWith('.html') && file.name.toLowerCase() !== 'index.html'
                );

                if (htmlFiles.length === 1) {
                    // Redirect immediately if there's only one tool
                    window.location.href = `./${htmlFiles[0].name}`;
                } else if (htmlFiles.length > 1) {
                    // Build the landing page list
                    let html = '<ul>';
                    htmlFiles.forEach(file => {
                        const displayName = file.name.replace('.html', '').replace(/_/g, ' ');
                        html += `<li><a href="./${file.name}">${displayName}</a></li>`;
                    });
                    html += '</ul>';
                    contentDiv.innerHTML = html;
                } else {
                    contentDiv.innerHTML = '<p>No tools found in this repository.</p>';
                }
            } catch (error) {
                contentDiv.innerHTML = '<p>Error loading tools. Please check your internet connection or repository settings.</p>';
                console.error('GitHub API Error:', error);
            }
        }

        loadTools();
    </script>
</body>
</html>
